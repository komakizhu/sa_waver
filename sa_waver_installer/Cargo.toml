[package]
name = "sa_waver_installer"
version = "0.2.1"
edition = "2021"
authors = ["sout <sout233@163.com>"]
license = "GPL-3.0-or-later"

[features]
default = []
windows-installer = [
    "dep:eframe",
    "dep:egui_extras",
    "dep:image",
    "dep:env_logger",
    "dep:rfd",
    "dep:windows",
]

[[bin]]
name = "sa_waver_installer"
path = "src/main.rs"
required-features = ["windows-installer"]

[dependencies]
eframe = { version = "0.31.1", optional = true }
egui_extras = { version = "0.31.1", features = ["image"], optional = true }
image = { version = "0.24.5", default-features = false, features = ["png"], optional = true }
env_logger = { version = "0.11.10", optional = true }
rfd = { version = "0.17.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading"], optional = true }
